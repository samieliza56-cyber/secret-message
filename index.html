<!DOCTYPE html>
<html>
<head>
    <title>Secret Message ❤️</title>
    <style>
        body{
            font-family:Arial;
            text-align:center;
            margin-top:100px;
            background:#fff0f5;
        }
    </style>
</head>
<body>

<h1>❤️ My Secret Message ❤️</h1>

<p>I have been wanting to tell you this...</p>

<p id="countdown"></p>

<script>
let seconds = 5;

let timer = setInterval(() => {
    document.getElementById("countdown").innerHTML =
        "Loading message in " + seconds + " seconds...";
    seconds--;

    if(seconds < 0){
        clearInterval(timer);

        document.body.innerHTML = `
            <h1>😂 GOT YOU!</h1>
            <h2>Stop looking for love and GO STUDY!</h2>
            <h3>Your exams won't pass themselves 📚</h3>
        `;
    }
},1000);
</script>

</body>
</html>
